{% extends "base.html" %}

{% block content %}
    <h1>Hi, {{ current_user.username }}!</h1>
    <p>Welcome to the Chat.</p>

    <div style="display: flex; justify-content: space-between;">
        <div style="width: 25%;">
            <h2>Users:</h2>
            <ul id="user-list" data-current-user="{{ current_user_username }}">
                <!-- User list will be populated by JavaScript -->
            </ul>
            <hr>
            <h2>Rooms:</h2>
            <ul id="room-list">
                <!-- Room list will be populated by JavaScript -->
            </ul>
            <hr>
            <h3>Create Room:</h3>
            <form id="create-room-form" action="{{ url_for('main.create_room') }}" method="POST">
                <input type="text" name="room_name" id="new-room-name" placeholder="New room name" required>
                <button type="submit">Create Room</button>
            </form>
        </div>

        <div style="width: 70%;">
            <h2>Chat with: <span id="chat-target-name">Nobody</span> (<span id="chat-type-display">DM</span>)</h2>
            <div id="messages" style="height: 300px; border: 1px solid #ccc; overflow-y: scroll; padding: 10px; margin-bottom: 10px;">
                <!-- Messages will appear here -->
            </div>
            <div id="invite-to-room-section" style="display:none; margin-bottom: 10px;">
                <input type="text" id="invite-username-input" placeholder="Username to invite">
                <button id="invite-user-button">Invite to Room</button>
            </div>
            <input type="text" id="message-input" placeholder="Enter message">
            <button id="send-button">Send Text</button>
            <button id="record-button">Record Voice</button>
            <button id="stop-record-button" style="display:none;">Stop Recording</button>
            <span id="timer" style="display:none;">0s</span>
            <input type="hidden" id="recipient-username-input"> {# Kept for DM logic, might be hidden or removed if UI changes #}
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
    <script src="{{ url_for('static', filename='js/video_call.js') }}"></script> {# Include video_call.js #}

    <div id="video-call-ui" style="display:none; margin-top: 20px;">
        <h2>Video Call</h2>
        <div>
            <video id="localVideo" autoplay muted style="width: 320px; border: 1px solid #ccc;"></video>
            <video id="remoteVideo" autoplay style="width: 320px; border: 1px solid #ccc;"></video>
        </div>
        <button id="end-call-button">End Call</button>
        <p id="call-status"></p>
    </div>

    <div id="incoming-call-alert" style="display:none; position: fixed; top: 20px; right: 20px; background-color: #f0f0f0; padding: 15px; border: 1px solid #ccc; z-index: 1000;">
        <p><span id="caller-username-span"></span> is calling you.</p>
        <button id="accept-call-button">Accept</button>
        <button id="reject-call-button">Reject</button>
    </div>
{% endblock %}
